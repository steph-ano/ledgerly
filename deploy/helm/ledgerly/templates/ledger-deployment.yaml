apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ledgerly.name" . }}-ledger
  labels:
    {{- include "ledgerly.labels" . | nindent 4 }}
    app: ledger
spec:
  replicas: {{ .Values.ledger.replicaCount }}
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      containers:
        - name: ledger
          image: "{{ .Values.ledger.image.repository }}:{{ .Values.ledger.image.tag }}"
          imagePullPolicy: {{ .Values.ledger.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ledger.port }}
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ledgerly.name" . }}-config
                  key: LEDGER_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ledgerly.name" . }}-secrets
                  key: DATABASE_URL
          resources:
            {{- toYaml .Values.ledger.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ledgerly.name" . }}-ledger
  labels:
    {{- include "ledgerly.labels" . | nindent 4 }}
    app: ledger
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.ledger.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: ledger
