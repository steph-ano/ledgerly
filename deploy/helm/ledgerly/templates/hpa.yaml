{{- if .Values.ledger.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ledgerly.name" . }}-ledger-hpa
  labels:
    {{- include "ledgerly.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ledgerly.name" . }}-ledger
  minReplicas: {{ .Values.ledger.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.ledger.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.ledger.autoscaling.targetCPUUtilizationPercentage }}
---
{{- end }}
{{- if .Values.bnplApi.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ledgerly.name" . }}-bnpl-api-hpa
  labels:
    {{- include "ledgerly.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ledgerly.name" . }}-bnpl-api
  minReplicas: {{ .Values.bnplApi.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.bnplApi.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.bnplApi.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
