global:
  environment: production
  domain: api.ledgerly.internal

# PostgreSQL connection string
database:
  host: "ledgerly-postgres.rds.amazonaws.com"
  port: 5432
  name: "ledgerly_production"
  username: "ledgerly_admin"
  sslmode: "require"

ledger:
  replicaCount: 3
  image:
    repository: ledgerly/ledger
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

bnplApi:
  replicaCount: 3
  image:
    repository: ledgerly/bnpl
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 8081
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

bnplWorker:
  replicaCount: 2
  image:
    repository: ledgerly/bnpl
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  command: ["/app/bnpl-worker"]
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

web:
  replicaCount: 2
  image:
    repository: ledgerly/web
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 80
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

ingress:
  enabled: true
  className: "alb"
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
  hosts:
    - host: app.ledgerly.internal
      paths:
        - path: /api/ledger
          pathType: Prefix
          service: ledger
        - path: /api/bnpl
          pathType: Prefix
          service: bnpl-api
        - path: /
          pathType: Prefix
          service: web
