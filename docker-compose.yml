services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledgerly
      POSTGRES_PASSWORD: ledgerly_secret
      POSTGRES_DB: ledgerly_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly -d ledgerly_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
