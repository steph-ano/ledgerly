services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledgerly
      POSTGRES_PASSWORD: ledgerly_secret
      POSTGRES_DB: ledgerly_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly -d ledgerly_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  ledger:
    build:
      context: ./services/ledger
      dockerfile: Dockerfile
    container_name: ledgerly-ledger-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://ledgerly:ledgerly_secret@postgres:5432/ledgerly_dev?sslmode=disable"
      PLATFORM_OVERDRAFT_LIMIT_CENTS: "0"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
